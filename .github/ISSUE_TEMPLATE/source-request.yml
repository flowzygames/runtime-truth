name: Version source request
description: Ask RuntimeTruth to recognize a real Node.js version declaration.
title: "source: support "
labels:
  - source-support
body:
  - type: input
    id: source
    attributes:
      label: File or tool
      placeholder: devcontainer.json, a Docker ARG pattern, or a reusable workflow
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Runtime role
      description: What does this declaration control?
      options:
        - Supported range or policy
        - Local developer default
        - CI or tested runtime
        - Build-time runtime
        - Production runtime
        - Unsure or multiple roles
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized fixture
      description: Paste the smallest real example. Remove secrets, registry names, and organization details.
      render: text
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: How the version should be interpreted
      description: Explain what the value means and link to authoritative tool documentation if available.
    validations:
      required: true
  - type: textarea
    id: conflict
    attributes:
      label: Example contradiction
      description: Show another declaration that should conflict with this one, if possible.
      render: text
  - type: checkboxes
    id: consent
    attributes:
      label: Fixture permission
      options:
        - label: This example is sanitized and may be included in RuntimeTruth's test suite under the MIT License.
          required: true
