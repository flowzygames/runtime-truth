<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RuntimeTruth social preview</title>
  <desc id="desc">RuntimeTruth catches incompatible Node.js versions across local development, CI, and production.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1198" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142239"/>
      <stop offset=".58" stop-color="#0A101C"/>
      <stop offset="1" stop-color="#08131A"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1080 130) rotate(135) scale(430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E8A8E" stop-opacity=".35"/>
      <stop offset="1" stop-color="#1E8A8E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="78" y1="0" x2="486" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#63D391"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#aura)"/>
  <g opacity=".13" stroke="#6AA4B8">
    <path d="M0 80h1280M0 160h1280M0 240h1280M0 320h1280M0 400h1280M0 480h1280M0 560h1280"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640M960 0v640M1040 0v640M1120 0v640M1200 0v640"/>
  </g>

  <g transform="translate(78 66)">
    <rect width="72" height="72" rx="18" fill="#101E2E" stroke="#35516A" stroke-width="2"/>
    <g fill="none" stroke="#657D93" stroke-width="4" stroke-linecap="round">
      <path d="M17 23h38"/>
      <path d="M17 36h38" opacity=".78"/>
      <path d="M17 49h38" opacity=".55"/>
    </g>
    <path d="m22 41 9 9 21-27" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="94" y="54" fill="#F1F7FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="750" letter-spacing="-1.6">RuntimeTruth</text>
  </g>

  <text x="78" y="243" fill="#F5F9FD" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="62" font-weight="760" letter-spacing="-2.2">Stop shipping the wrong Node.js.</text>
  <text x="80" y="297" fill="#A6B6C9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27">Zero-config runtime drift checks for local, CI, and Docker.</text>

  <g transform="translate(78 370)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="1124" height="146" rx="18" fill="#0A111C" stroke="#2B3C52" stroke-width="2"/>
    <path d="M374 37v72M750 37v72" stroke="#27394F" stroke-width="2"/>

    <text x="30" y="38" fill="#6F829A" font-size="17" font-weight="700">LOCAL DEFAULT</text>
    <text x="30" y="92" fill="#63D391" font-size="38" font-weight="700">✓ Node 22</text>

    <text x="406" y="38" fill="#6F829A" font-size="17" font-weight="700">CI MATRIX</text>
    <text x="406" y="92" fill="#5CE1E6" font-size="38" font-weight="700">✓ 20, 22</text>

    <text x="782" y="38" fill="#98717B" font-size="17" font-weight="700">PRODUCTION</text>
    <text x="782" y="92" fill="#FF788C" font-size="38" font-weight="700">✗ Node 18</text>
  </g>

  <g transform="translate(80 575)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text fill="#63D391">$</text>
    <text x="28" fill="#D6E1EC">npx runtime-truth check</text>
    <text x="967" fill="#71839A">github.com/flowzygames</text>
  </g>
</svg>
