<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">RuntimeTruth terminal demonstration</title>
  <desc id="desc">RuntimeTruth checks four Node.js version declarations and finds that a Docker production image on Node 18 conflicts with a supported range of Node 20 or newer.</desc>
  <defs>
    <linearGradient id="frame" x1="40" y1="20" x2="960" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26374F"/>
      <stop offset="1" stop-color="#142033"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#63D391"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02040A" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1000" height="600" rx="28" fill="#0A0F19"/>
  <g opacity=".45">
    <circle cx="878" cy="64" r="180" fill="#123A46"/>
    <circle cx="78" cy="574" r="190" fill="#172E3F"/>
  </g>
  <rect x="40" y="28" width="920" height="544" rx="20" fill="url(#frame)" filter="url(#shadow)"/>
  <rect x="42" y="30" width="916" height="540" rx="18" fill="#0D1420"/>
  <path d="M42 90h916" stroke="#26374F" stroke-width="2"/>
  <circle cx="75" cy="60" r="8" fill="#FF6B6B"/>
  <circle cx="103" cy="60" r="8" fill="#F5C451"/>
  <circle cx="131" cy="60" r="8" fill="#63D391"/>
  <text x="500" y="66" text-anchor="middle" fill="#72829B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">runtime-truth — repository</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <text x="80" y="132" fill="#63D391">$</text>
    <text x="106" y="132" fill="#EDF6FF">npx runtime-truth check</text>

    <text x="80" y="182" fill="url(#accent)" font-size="25" font-weight="700">RuntimeTruth</text>
    <text x="318" y="182" fill="#65758D">role-aware Node.js drift check</text>

    <text x="80" y="234" fill="#63D391">✓</text>
    <text x="116" y="234" fill="#B7C4D5">package.json:18</text>
    <text x="380" y="234" fill="#71839A">support</text>
    <text x="547" y="234" fill="#EDF6FF">&gt;=20</text>

    <text x="80" y="276" fill="#63D391">✓</text>
    <text x="116" y="276" fill="#B7C4D5">.nvmrc:1</text>
    <text x="380" y="276" fill="#71839A">local</text>
    <text x="547" y="276" fill="#EDF6FF">22</text>

    <text x="80" y="318" fill="#63D391">✓</text>
    <text x="116" y="318" fill="#B7C4D5">.github/workflows/ci.yml:24</text>
    <text x="620" y="318" fill="#71839A">test</text>
    <text x="750" y="318" fill="#EDF6FF">20, 22</text>

    <rect x="64" y="342" width="872" height="56" rx="9" fill="#26171D" stroke="#5C2935"/>
    <text x="80" y="378" fill="#FF788C">✗</text>
    <text x="116" y="378" fill="#F5C3CB">Dockerfile:1</text>
    <text x="380" y="378" fill="#B77B88">production</text>
    <text x="547" y="378" fill="#FF96A5">18</text>

    <text x="80" y="444" fill="#FF96A5" font-weight="700">Runtime drift found</text>
    <text x="80" y="480" fill="#A7B5C8" font-size="17">Production uses Node 18, outside the declared support range &gt;=20.</text>

    <text x="80" y="532" fill="#71839A">4 sources checked</text>
    <text x="294" y="532" fill="#40516A">·</text>
    <text x="322" y="532" fill="#FF788C">1 contradiction</text>
    <text x="516" y="532" fill="#40516A">·</text>
    <text x="544" y="532" fill="#71839A">exit 1</text>
  </g>
</svg>
